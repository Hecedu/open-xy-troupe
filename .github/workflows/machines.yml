name: Machine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Public OS 1.2.1 staging plus the separate preview-memory and display-reset
  # PRs (#138 and #139). No local SDK modifications or memory overrides.
  OPEN_XY_REF: 153c826218affa021c34cc00603b5e887362b45d
jobs:
  machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machine
      - uses: actions/checkout@v4
        with:
          repository: Hecedu/open-xy
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Machine source, preview and sound checks
        run: python open-xy/sdk.py test --machine machine --cxx clang++ --host-cxx g++
      - name: Machine-owned data, artwork and adapter checks
        env:
          OPEN_XY_SDK: ${{ github.workspace }}/open-xy
          CXX: g++
        run: python machine/tests/check.py
  firmware:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machine
      - uses: actions/checkout@v4
        with:
          repository: Hecedu/open-xy
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Blackfin tools
        run: python open-xy/sdk.py toolchain fetch
      - name: Native compile (no stock firmware or device)
        run: python open-xy/sdk.py compile --machine machine --out "${{ runner.temp }}/module"
